name: LeapYear Technologies
description: >-
  LeapYear Technologies built an enterprise platform for differentially private
  analytics and machine learning, letting organizations compute over highly
  sensitive data and share it across internal silos and external partners with
  mathematically proven privacy guarantees. LeapYear Core was licensed,
  self-hosted software rather than a public multi-tenant API: customers ran
  their own server and reached it through a first-party Python client, with
  every computation drawing down a quantified privacy exposure budget enforced
  by the server. Snowflake announced its intent to acquire LeapYear on
  2023-02-07 and closed on 2023-02-10 for USD 62.0 million in cash, primarily
  for talent and developed technology, folding the differential privacy
  capability into its Global Data Clean Room offering. The company no longer
  operates independently, leapyear.io is now a Snowflake-controlled redirect,
  and the only surviving first-party documentation is the Python client API
  reference on its readthedocs host.
